    <!-- Datos estructurados. Sólo van las propiedades confirmadas.
         Falta "url", hasta que haya dominio (ver DATOS A COMPLETAR en src/main.js).
         No va "aggregateRating": marcar como propio un puntaje tomado de Google
         va contra las políticas de resultados enriquecidos. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "name": "Taller Génesis",
        "description": "Taller de mecánica general en Neuquén capital. Diagnóstico, frenos, suspensión y dirección, service y cambio de aceite.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Paso Aguerre 3811",
          "addressLocality": "Neuquén",
          "addressRegion": "Neuquén",
          "postalCode": "Q8300",
          "addressCountry": "AR"
        },
        "telephone": "+54-299-424-8571",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        "sameAs": "https://www.instagram.com/tallergenesis_nqn",
        "areaServed": { "@type": "City", "name": "Neuquén" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
